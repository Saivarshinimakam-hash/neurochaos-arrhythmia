# ── Reproducibility ─────────────────────────────────────────
seed: 42

# ── Dataset ─────────────────────────────────────────────────
dataset:
  name: "MIT-BIH Arrhythmia Database"
  source: "PhysioNet"
  version: "1.0.0"
  url: "https://physionet.org/content/mitdb/1.0.0/"
  # wfdb will download here if the directory is empty.
  # Set to an absolute path if you have a local copy.
  raw_dir: "data/raw/mitdb"
  processed_dir: "data/processed"
  features_dir: "data/features"

  # Sampling frequency of the MIT-BIH records (360 Hz — do not change).
  fs: 360

  # Lead to use for single-channel experiments.
  # MIT-BIH has two channels: MLII (index 0) and V1/V5 (index 1).
  lead: 0   # MLII

  # All 48 record IDs in MIT-BIH (records 102, 104, 107, 217 have paced beats).
