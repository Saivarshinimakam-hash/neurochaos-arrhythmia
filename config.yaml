# ── AAMI 5-class annotation mapping ─────────────────────────
# Reference: ANSI/AAMI EC57:2012 standard.
# Beat symbols used in wfdb annotation files.
aami_mapping:
  N:   # Normal and near-normal beats
    - "N"   # Normal beat
    - "L"   # Left bundle branch block beat
    - "R"   # Right bundle branch block beat
    - "e"   # Atrial escape beat
    - "j"   # Nodal (junctional) escape beat
  S:   # Supraventricular ectopic beats
    - "A"   # Atrial premature beat
    - "a"   # Aberrated atrial premature beat
    - "J"   # Nodal (junctional) premature beat
    - "S"   # Supraventricular premature beat
  V:   # Ventricular ectopic beats
    - "V"   # Premature ventricular contraction
    - "E"   # Ventricular escape beat
  F:   # Fusion beats
    - "F"   # Fusion of ventricular and normal beat
  Q:   # Unknown / paced / unclassifiable
    - "/"   # Paced beat
    - "f"   # Fusion of paced and normal beat
    - "Q"   # Unclassifiable beat

# Class index mapping (used for model outputs)
class_labels:
  N: 0
  S: 1
  V: 2
  F: 3
  Q: 4

# ── Preprocessing ────────────────────────────────────────────
preprocessing:
  # Butterworth band-pass filter
  bandpass:
    lowcut: 0.5    # Hz
    highcut: 40.0  # Hz
    order: 4       # filter order (4 is numerically stable for ECG)

  # Per-beat normalisation strategy: "zscore" or "minmax"
  normalization: "zscore"

  # Beat segmentation window around R-peak (in samples at 360 Hz)
  # 0.3 s before + 0.5 s after = 288 samples total
  beat_before_samples: 108   # 0.3 s × 360 Hz
  beat_after_samples: 180    # 0.5 s × 360 Hz
  beat_window_size: 288      # total samples per beat

# ── NeuroChaos feature extraction ───────────────────────────
neurochaos:
  # Sample Entropy
  sample_entropy:
    m: 2          # embedding dimension
    r_factor: 0.2 # tolerance = r_factor × std(signal)

  # Permutation Entropy
  permutation_entropy:
    order: 3      # embedding dimension
    delay: 1      # time delay

  # Approximate Entropy
  approximate_entropy:
    m: 2
    r_factor: 0.2

  # Recurrence Quantification Analysis
  rqa:
    dimension: 3    # embedding dimension
    time_delay: 1
    threshold: 0.1  # recurrence threshold (fraction of max distance)

  # Lyapunov exponent (nolds)
  lyapunov:
    emb_dim: 3

  # Phase space
  phase_space:
    emb_dim: 3
    time_delay: 1

  # Fractal / complexity
  fractal:
    dfa_order: 1   # DFA polynomial order

# ── Classical ML ─────────────────────────────────────────────
classical_ml:
  logistic_regression:
    max_iter: 1000
    C: 1.0
    solver: "lbfgs"
    multi_class: "multinomial"
  random_forest:
    n_estimators: 200
    max_depth: null   # grow full trees
    n_jobs: -1
  svm:
    C: 1.0
    kernel: "rbf"
    gamma: "scale"
    probability: true  # needed for ROC-AUC

# ── 1D CNN ───────────────────────────────────────────────────
cnn:
  filters: [32, 64, 128]
  kernel_size: 5
  pool_size: 2
  dropout: 0.3
  dense_units: 128
  batch_size: 128
  epochs: 50
  learning_rate: 0.001
  early_stopping_patience: 10

# ── Bi-LSTM ──────────────────────────────────────────────────
bilstm:
  units: [64, 64]
  dropout: 0.3
  recurrent_dropout: 0.2
  dense_units: 64
  batch_size: 128
  epochs: 50
  learning_rate: 0.001
  early_stopping_patience: 10

# ── Hybrid model ─────────────────────────────────────────────
hybrid:
  neural_backbone: "cnn"   # "cnn" or "bilstm"
  embedding_dim: 64        # neural branch output size
  mlp_hidden_units: [128, 64]
  dropout: 0.3
  batch_size: 128
  epochs: 50
  learning_rate: 0.001
  early_stopping_patience: 10

# ── Output directories ───────────────────────────────────────
output:
  models_dir: "models"
  results_dir: "results"
  cache_dir: "data/cache"
  confusion_matrices_dir: "results/confusion_matrices"
  figures_dir: "results/figures"
  metrics_dir: "results/metrics"
  experiments_dir: "results/experiments"
  logs_dir: "results/logs"

# ── Robustness experiment ────────────────────────────────────
robustness:
  noise_levels:
    clean:  0.0
    low:    0.05   # SNR ~26 dB
    medium: 0.15   # SNR ~16 dB
    high:   0.30   # SNR ~10 dB
  noise_type: "gaussian"  # additive white Gaussian noise
